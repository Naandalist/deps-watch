headline: "Contribution board: OmniRoute and TidGi still need fix PRs; sift, decompress, node-forge, expr-eval, and @alifd/next open PRs need review. Resolved column cleared."
paragraphs:
  - "Re-verified for 2026-09-18 with an owner request to drop already-fixed packages. The board is now almost only needs-pr and pr-open. Recently resolved is empty. OmniRoute remains Critical and unfixed through 3.8.50. TidGi (GHSA-9hc2) is a new Critical needs-pr with an open sandbox issue. gpt-crawler still has no fix PR. Open review work stays active for sift, decompress, node-forge, expr-eval, and @alifd/next."
  - "Highest-impact review today is still node-forge PR 1152 (~27.7M weekly installs). For a from-scratch Critical, OmniRoute has no patched npm release yet. sift PR 277 is Critical and reaches about 5.8M weekly installs if you prefer review over writing a patch."
pick:
  label: "Worth doing today"
  package: omniroute
  action_label: "Open a fix PR"
  action_url: "https://github.com/advisories/GHSA-hf57-cqmx-p4gr"
  approach: "Read GHSA-hf57 (ACP Custom-Agent RCE). Confirm npm is still 3.8.50 with first_patched_version null, reproduce against the advisory steps, then open a focused fix PR on diegosouzapw/OmniRoute and push for a patched 3.8.51+ release."
