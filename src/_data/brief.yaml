headline: "Make-up refresh: Critical decompress joins the open-PR queue, while OmniRoute still needs a first patched release."
paragraphs:
  - "Re-verified the whole board for 2026-09-12. Ready cards still hold: OmniRoute remains Critical through 3.8.50 with no first_patched_version on GHSA-hf57, and the four smaller needs-pr cards are unchanged. In progress grows with two newly confirmed High/Critical items that already have fix PRs: decompress (path slip, still 4.2.1) and expr-eval (function injection, still 2.0.2). sift and node-forge stay open for review. Recently resolved next/astro/maplibre-gl/js-yaml/sharp are still patched on npm."
  - "If you can only do one thing, review sift PR 277. It is Critical on about 4.7 million weekly installs and still waiting on maintainers. For wider blast radius, node-forge PR 1152 covers roughly 27 million weekly downloads. For a newly surfaced Critical archive issue, decompress PR 112 needs eyes too. For a from-scratch Critical, OmniRoute still needs a fix that ships past 3.8.50."
pick:
  label: "Worth doing today"
  package: sift
  action_label: "Review the open PR"
  action_url: "https://github.com/crcn/sift.js/pull/277"
  approach: "Read PR 277 against issue 276. Confirm the own-property guards cover both enumeration loops, then leave a review or a failing test if anything still slips through."
