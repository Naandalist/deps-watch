headline: "Monday refresh: sift has fresh fix activity; OmniRoute still needs its first patched release."
paragraphs:
  - "Re-verified the board for 2026-09-15. Critical OmniRoute remains unfixed through 3.8.50, while gpt-crawler, @alifd/next, @cgauge/yaml, and with-context-mcp still need first contributions. sift, node-forge, decompress, and expr-eval keep open fix PRs; sift PR 277 had new activity today. Recent fixes remain available for next, astro, maplibre-gl, js-yaml, and sharp."
  - "Review work has biggest immediate reach: node-forge PR 1152 covers about 27.7 million weekly installs. sift PR 277 is Critical, recently updated, and reaches about 4.8 million weekly installs; decompress PR 112 reaches about 2.5 million. OmniRoute remains best from-scratch Critical task because no patched npm release exists."
pick:
