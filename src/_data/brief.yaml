headline: "Quiet Monday start: no new unpatched High or Critical npm cards over the weekend, so gray-matter PR 182 is the Critical review worth a contributor's time today."
paragraphs:
  - "Morning refresh for 2026-10-19 (Asia/Jakarta). Re-opened every action_url: all eight fix PRs remain open and unmerged, both Ready tracking issues remain open, and no package on the board has published a patched npm release. GHSA published no new npm High or Critical advisories since the TanStack Start, Qwik, OpenNext Cloudflare and Claude Code entries, all of which ship fixes. New Snyk entries are malicious-package takedowns plus thrift issues already fixed in 0.25.0, so no cards were added or dropped."
  - "gray-matter PR 182 (~11M weekly installs, Critical) has had no maintainer activity since 2026-09-24 and still removes the eval-based front-matter engine. The High review queue by installs is braces PR 79 (~169M, with alternatives 78, 82, 87 and 88 also open), uri-js PR 107 (~155M), deepmerge PR 277 (~102M), and node-forge PR 1152 (~40M). Critical PRs at decompress 112 and zerox 208 still wait on maintainers, while TidGi issue 713 (Critical) and gpt-crawler issue 418 remain the Ready cards for writing a fix."
pick:
  label: "Worth doing today"
  package: gray-matter
  action_label: "Review the open PR"
  action_url: "https://github.com/jonschlinkert/gray-matter/pull/182"
  approach: "Read PR 182 next to CVE-2026-78847, run the gray-matter test suite on the branch, and leave a short review confirming YAML, TOML and JSON front matter still parse the same so the maintainer has a low-risk path to a release past 4.0.3."
