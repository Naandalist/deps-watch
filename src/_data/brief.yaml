headline: "Two of the biggest cards got fresh fix PRs overnight: deepmerge PR 277 and braces PR 77 now need reviewers across ~328M weekly installs."
paragraphs:
  - "Morning refresh for 2026-10-06 (Asia/Jakarta). Re-opened every action_url and re-scanned GitHub Advisory, Snyk, and Aikido. deepmerge moved from Ready to In progress: PR 277 landed on 2026-10-05 to keep own __proto__ keys from changing the merged object's prototype, even though the maintainer closed issue 273 as noise. braces PR 72 was closed unmerged after the maintainer disputed CVE-2026-93687 and pointed to the existing maxLength option, so the card now points at PR 77, an opt-in maxDepth limit opened the same day. New advisory traffic (vm2 3.11.x, trigger.dev, fastify, @fastify/busboy, devalue, piscina) is already patched, so no new cards were added."
  - "Review load by weekly installs: braces PR 77 (~207M), uri-js PR 107 (~195M), deepmerge PR 277 (~121M), and node-forge PR 1152 (~48M) lead the High queue, while Critical PRs at gray-matter 182, sift 277, decompress 112, and zerox 208 still wait on maintainers. With nine open PRs the In progress column shows its top eight, so expr-eval PR 288 is off-screen today but still open. For writing a fix from scratch, TidGi issue 713 (Critical) and gpt-crawler issue 418 remain the only Ready cards."
pick:
  label: "Worth doing today"
  package: deepmerge
  action_label: "Review the open PR"
  action_url: "https://github.com/TehShrike/deepmerge/pull/277"
  approach: "Read PR 277 against CVE-2026-93753, run the test suite, and check that ordinary keys still merge the same way while own __proto__ keys stay plain data properties; leave a clear, polite review, since the maintainer has said they are tired of low-quality reports."
