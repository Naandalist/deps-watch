headline: "New overnight: picomatch (~316M weekly installs) has a High ReDoS with no fixed version and no fix PR, making it today's best chance to write a patch."
paragraphs:
  - "Morning refresh for 2026-10-22 (Asia/Jakarta). Snyk published CVE-2026-112366 for picomatch: single-branch repeated extglob patterns slip past the analyzeRepeatedExtglob guard in lib/parse.js, and every release through 4.0.7 is affected. Tracking issue 234 is open and no open pull request targets the bug, so it joins the board as a Ready card. GHSA's new npm High and Critical advisories (Storybook, ApostropheCMS import-export, markdown-it, launch-editor and the Model Context Protocol SDK) all ship patched versions, so they were not added."
  - "Re-opened every other action_url: all eight fix PRs are still open and unmerged, the TidGi and gpt-crawler tracking issues are still open, and no package on the board has a patched npm release. deepmerge PR 277, braces PR 79, uri-js PR 107 and node-forge PR 1152 remain the high-install reviews, while the Critical PRs for gray-matter 182, decompress 112 and zerox 208 still wait on maintainers."
pick:
  label: "Worth doing today"
  package: picomatch
  action_label: "Write a fix PR"
  action_url: "https://github.com/micromatch/picomatch/issues/234"
  approach: "Read issue 234 and the analyzeRepeatedExtglob logic in lib/parse.js, coordinate on the issue before opening a pull request, and propose a change that covers single-branch repeated extglobs with regression tests and benchmarks showing matching stays fast."
