headline: "Twelve contribution cards still hold — aged OmniRoute, gpt-crawler, and sift were re-verified and kept on the board."
paragraphs:
  - "Re-checked GitHub Advisory, Snyk, and Aikido for 2026-09-27. Nothing published on 2026-09-26 or 2026-09-27 that belongs on this contribution board; recent Critical and High npm advisories (Knowns path traversal, OpenZeppelin confidential-contracts, Cline Hub WS hijack, @rsdoctor/rspack-plugin, DBHub variants, SunEditor XSS, and related packages) already ship patched releases. All five needs-pr cards remain true: OmniRoute GHSA-hf57 still lists no first patched version through npm 3.8.50, TidGi issue 713 is open, gpt-crawler issue 418 is open, uri-js issue 105 is open, and deepmerge issue 273 is still waiting after PR 274 closed unmerged. All seven pr-open reviews are still open and unmerged. Re-touched OmniRoute, gpt-crawler, and sift dates after re-verification so the age window would not hide still-open work. Recently resolved stays empty."
  - "Best from-scratch write today is deepmerge at about 110 million weekly installs — open issue 273 and replace the closed PR 274 approach. Highest-impact review remains source-map-js PR 78 at about 213 million weekly. uri-js issue 105 is still a High DoS gap at about 181 million weekly. Other open review load: node-forge PR 1152 (~47.0M), gray-matter PR 182 (Critical, ~11.2M), sift PR 277 (Critical, ~7.5M), decompress PR 112, expr-eval PR 288, and @alifd/next PR 5115. OmniRoute stays the top Critical from-scratch card because Global GHSA-hf57 still lists no first patched version on npm through 3.8.50."
pick:
  label: "Worth doing today"
  package: deepmerge
  action_label: "Open a fresh fix PR"
  action_url: "https://github.com/TehShrike/deepmerge/issues/273"
  approach: "Read issue 273 and the closed PR 274 discussion, then open a new PR that drops __proto__ keys regardless of the target shape, add regression tests for prototype-poisoning via mergeObject, and ask for maintainer review so a release past 4.3.1 can ship."
