headline: "Board is stable: OmniRoute still needs a Critical fix PR, while sift and node-forge keep waiting on review."
paragraphs:
  - "Overnight GHSA traffic was mostly already-patched Highs (Angular SSR XSS/SSRF, smol-toml DoS, multer and nodemailer DoS), so they do not displace the Resolved column. Ready and In progress statuses are unchanged: OmniRoute is still vulnerable through 3.8.50 with no first_patched_version, the four smaller needs-pr cards remain open, and sift plus node-forge still have open fix PRs."
  - "If you can only do one thing, review sift PR 277. It is Critical, covers about 4.7 million weekly installs, and maintainers still have not merged. For wider blast radius, node-forge PR 1152 is open on roughly 27 million weekly downloads. For a from-scratch Critical, OmniRoute still needs a fix PR that ships a patched release."
pick:
  label: "Worth doing today"
  package: sift
  action_label: "Review the open PR"
  action_url: "https://github.com/crcn/sift.js/pull/277"
  approach: "Read PR 277 against issue 276. Confirm the own-property guards cover both enumeration loops, then leave a review or a failing test if anything still slips through."