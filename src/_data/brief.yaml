headline: "Twelve High and Critical contribution cards after uri-js gained a fix PR and braces landed on the board."
paragraphs:
  - "Morning refresh for 2026-10-02 (Asia/Jakarta). Re-opened every action_url and re-scanned GitHub Advisory, Snyk, and Aikido. uri-js (CVE-2026-93690) moved needs-pr → pr-open with fix PR 107. Added braces (CVE-2026-93687, High) with open PR 72 for the stack-overflow DoS in nested brace expansion — npm still 3.0.3. Fresh Critical/High GHSA traffic today is mostly already patched (vm2 3.11.7, devalue 5.9.3, basic-ftp 6.2.1, fastify 5.12.2, axios 1.20.0, @grpc/grpc-js, Angular SSR router lines). Recently resolved stays empty."
  - "Highest-impact review today is braces PR 72 at about 199 million weekly installs. Close behind: uri-js PR 107 (~185M), http-cache-semantics PR 58 (~59.1M), and node-forge PR 1152 (~45.9M). Other open review load: gray-matter PR 182 (Critical, ~12.0M), sift PR 277 (Critical, ~7.8M), decompress PR 112, expr-eval PR 288, and zerox PR 208 (Critical, 12.3k stars). Best from-scratch write remains deepmerge at about 114 million weekly — open issue 273 after PR 274 closed unmerged. TidGi issue 713 and gpt-crawler issue 418 remain open Critical/High needs-pr cards."
pick:
  label: "Worth doing today"
  package: braces
  action_label: "Review the open PR"
  action_url: "https://github.com/micromatch/braces/pull/72"
  approach: "Read PR 72 and issue 70 for CVE-2026-93687, confirm the AST walkers gain a safe depth guard without breaking valid expansions, then leave a review so a release past 3.0.3 can ship."
