headline: "Twelve High and Critical contribution cards after adding http-cache-semantics PR 58; morning board otherwise still open."
paragraphs:
  - "Owner-requested afternoon refresh for 2026-09-29 (Asia/Jakarta). Re-opened every action_url and re-scanned GHSA, Snyk, and Aikido. All five needs-pr cards remain true: OmniRoute GHSA-hf57 still lists no first patched version through npm 3.8.50 (release/v3.8.51 is not green and not published), TidGi issue 713 is open, gpt-crawler issue 418 is open, uri-js issue 105 is open, and deepmerge issue 273 is still waiting after PR 274 closed unmerged. Six prior pr-open reviews are still open and unmerged. Added http-cache-semantics (CVE-2026-93748 High, ~57.3M weekly, ★260) with open fix PR 58 — npm remains 4.2.0. Recent Critical/High advisories with patched releases (Angular SSR on supported lines, fast-uri, code-ollama, DBHub, SunEditor, Knowns, OpenZeppelin confidential-contracts, and related) stay off the board. Angular v19-only unpatched ranges and abandoned xmldom were skipped. Recently resolved stays empty."
  - "Highest-impact new review is http-cache-semantics PR 58 at about 57.3 million weekly installs. Other open review load: source-map-js PR 78 (~213M), node-forge PR 1152 (~44.6M), gray-matter PR 182 (Critical, ~11.4M), sift PR 277 (Critical, ~7.5M), decompress PR 112, and expr-eval PR 288. Best from-scratch write remains deepmerge at about 109 million weekly — open issue 273 and replace the closed PR 274 approach. uri-js issue 105 is still a High DoS gap at about 179 million weekly. OmniRoute stays the top Critical from-scratch card because Global GHSA-hf57 still lists no first patched version on npm through 3.8.50."
pick:
  label: "Worth doing today"
  package: http-cache-semantics
  action_label: "Review the open PR"
  action_url: "https://github.com/kornelski/http-cache-semantics/pull/58"
  approach: "Read PR 58 and issue 56 for CVE-2026-93748, verify max-stale no longer overrides shared-cache reuse bans (Set-Cookie / proxy-revalidate) without breaking ordinary stale reuse, then leave a review so a release past 4.2.0 can ship."