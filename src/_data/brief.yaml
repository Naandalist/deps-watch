headline: "Twelve High and Critical cards still open; braces PR 72 remains the highest-impact review at ~205M weekly installs."
paragraphs:
  - "Morning refresh for 2026-10-04 (Asia/Jakarta). Re-opened every action_url and re-scanned GitHub Advisory, Snyk, and Aikido. No new High/Critical npm cards worth adding — fresh advisory traffic is already patched (@a2ui/web_core 0.10.2, trigger.dev 4.5.4, probe-image-size 7.4.0, @fastify/busboy 3.2.1, vm2, orval, next/satori). All three needs-pr cards stay true: tidgi issue 713 and gpt-crawler issue 418 remain open with no fix PR; deepmerge issue 273 stays closed wontfix with PR 274 unmerged and npm still 4.3.1. All nine fix PRs remain open. Recently resolved stays empty."
  - "Highest-impact review today is braces PR 72 at about 205 million weekly installs (updated 2026-10-03). Close behind: uri-js PR 107 (~190M), http-cache-semantics PR 58 (~60.4M), and node-forge PR 1152 (~47.5M). Other open review load: gray-matter PR 182 (Critical, ~12.4M), sift PR 277 (Critical, ~7.9M), decompress PR 112, expr-eval PR 288, and zerox PR 208 (Critical, 12.3k stars). Best from-scratch write remains deepmerge at about 118 million weekly despite the closed tracking issue — or TidGi issue 713 and gpt-crawler issue 418 for Critical/High needs-pr work with open maintainers."
pick:
  label: "Worth doing today"
  package: braces
  action_label: "Review the open PR"
  action_url: "https://github.com/micromatch/braces/pull/72"
  approach: "Read PR 72 and issue 70 for CVE-2026-93687, confirm the AST walkers gain a safe depth guard without breaking valid expansions, then leave a review so a release past 3.0.3 can ship."
