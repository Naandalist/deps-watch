headline: "Thursday board: Critical OmniRoute still needs a patched release; sift and node-forge open PRs carry the most review load."
paragraphs:
  - "Re-verified the board for 2026-09-17. OmniRoute remains Critical and unfixed through 3.8.50. gpt-crawler, @alifd/next, @cgauge/yaml, and with-context-mcp still need first contributions. Open fix PRs stay active for sift, node-forge, decompress, and expr-eval. Newly disclosed @nuxtjs/mdc High XSS is already patched on npm; @zereight/mcp-gitlab Critical fixes remain on the resolved column."
  - "Review work still has the biggest reach: node-forge PR 1152 covers about 27.7 million weekly installs. sift PR 277 is Critical and reaches about 4.8 million; decompress PR 112 reaches about 2.5 million. OmniRoute remains the best from-scratch Critical task because no patched npm release exists."
pick:
  label: "Worth doing today"
  package: sift
  action_label: "Review the open PR"
  action_url: "https://github.com/crcn/sift.js/pull/277"
  approach: "Read PR 277 for the inherited-key enumeration fix. Confirm operator lookup no longer walks the prototype chain, check the regression tests for $where and polluted Object.prototype cases, then leave a review."