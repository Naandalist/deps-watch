headline: "No new High or Critical unfixed advisories today — twelve contribution cards still hold after a full re-check."
paragraphs:
  - "Re-checked GitHub Advisory, Snyk, and Aikido for 2026-09-26. Fresh Critical and High npm advisories from the last day (Knowns path traversal CVE-2026-86439, OpenZeppelin confidential-contracts, Cline Hub WS hijack, @rsdoctor/rspack-plugin, DBHub variants, and related packages) already ship patched releases, so they stay off this contribution board. All five needs-pr cards remain true: OmniRoute GHSA-hf57 still lists no first patched version through npm 3.8.50, TidGi issue 713 is open, gpt-crawler issue 418 is open, uri-js issue 105 is open, and deepmerge issue 273 is still waiting after PR 274 closed unmerged. All seven pr-open reviews are still open and unmerged. Recently resolved stays empty."
  - "Highest-impact review today is source-map-js PR 78 at about 176 million weekly installs. Best from-scratch write is still deepmerge at about 90.6 million weekly — open issue 273 and replace the closed PR 274 approach. uri-js issue 105 remains a High DoS gap at about 150 million weekly. Other open review load: node-forge PR 1152 (~31.3M), gray-matter PR 182 (Critical, ~9.2M), sift PR 277 (Critical, ~6.2M), decompress PR 112, expr-eval PR 288, and @alifd/next PR 5115. OmniRoute stays the top Critical from-scratch card because Global GHSA-hf57 still lists no first patched version on npm through 3.8.50."
pick:
  label: "Worth doing today"
  package: source-map-js
  action_label: "Review the open PR"
  action_url: "https://github.com/7rulnik/source-map-js/pull/78"
  approach: "Open PR 78, confirm the indexed source-map section offset validation stops the event-loop DoS without breaking valid maps, run the existing test suite, and ask for a maintainer review so a release past 1.2.1 can ship."
