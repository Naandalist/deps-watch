headline: "Twelve High and Critical contribution cards remain open after the 2026-09-30 morning Snyk, GHSA, and Aikido pass."
paragraphs:
  - "Morning refresh for 2026-09-30 (Asia/Jakarta). Re-opened every action_url and re-scanned GitHub Advisory, Snyk, and Aikido. Nothing published on 2026-09-29 or 2026-09-30 that belongs on this contribution board: recent Critical and High npm advisories (adm-zip 0.6.1, undici 6.28.1/7.29.1/8.10.2, joi, Electron sandbox/handler lines, webpack-dev-middleware 7.4.6/8.3.0, fast-uri, Angular SSR on supported 20–22 lines, DBHub, SunEditor, Knowns, vm2, orval, @fastify/middie, and related) already ship patched releases. Angular v19-only unpatched ranges and duplicate advisories were skipped. All five needs-pr cards remain true: OmniRoute GHSA-hf57 still lists no first patched version through npm 3.8.50, TidGi issue 713 is open, gpt-crawler issue 418 is open, uri-js issue 105 is open, and deepmerge issue 273 is still waiting after PR 274 closed unmerged. All seven pr-open reviews are still open and unmerged. Recently resolved stays empty."
  - "Highest-impact review today is source-map-js PR 78 at about 218 million weekly installs. Other open review load: http-cache-semantics PR 58 (~57.3M), node-forge PR 1152 (~45.1M), gray-matter PR 182 (Critical, ~11.7M), sift PR 277 (Critical, ~7.5M), decompress PR 112, and expr-eval PR 288. Best from-scratch write remains deepmerge at about 109 million weekly — open issue 273 and replace the closed PR 274 approach. uri-js issue 105 is still a High DoS gap at about 182 million weekly. OmniRoute stays the top Critical from-scratch card because Global GHSA-hf57 still lists no first patched version on npm through 3.8.50."
pick:
  label: "Worth doing today"
  package: source-map-js
  action_label: "Review the open PR"
  action_url: "https://github.com/7rulnik/source-map-js/pull/78"
  approach: "Read PR 78 and the CVE-2026-93749 notes, verify indexed source-map section offsets are validated so oversized or negative offsets cannot hang the event loop, then leave a review so a release past 1.2.1 can ship."
