headline: "Eleven High and Critical contribution cards stay open after a fresh Snyk, GHSA, and Aikido pass."
paragraphs:
  - "Re-checked GitHub Advisory, Snyk, and Aikido for 2026-09-29. Nothing published on 2026-09-28 or 2026-09-29 that belongs on this contribution board; recent Critical and High npm advisories (Angular SSR DoS/XSS on newer release lines, fast-uri authority/host injection, code-ollama grep_search injection, DBHub DNS rebinding, SunEditor XSS, Knowns path traversal, OpenZeppelin confidential-contracts, Cline Hub WS hijack, @rsdoctor/rspack-plugin, and related packages) already ship patched releases. The withdrawn Knowns duplicate Critical was skipped. All five needs-pr cards remain true: OmniRoute GHSA-hf57 still lists no first patched version through npm 3.8.50, TidGi issue 713 is open, gpt-crawler issue 418 is open, uri-js issue 105 is open, and deepmerge issue 273 is still waiting after PR 274 closed unmerged. All six pr-open reviews are still open and unmerged. Recently resolved stays empty."
  - "Highest-impact review today is node-forge PR 1152 at about 44.6 million weekly installs. Best from-scratch write remains deepmerge at about 109 million weekly — open issue 273 and replace the closed PR 274 approach. uri-js issue 105 is still a High DoS gap at about 179 million weekly. Other open review load: source-map-js PR 78 (~213M), gray-matter PR 182 (Critical, ~11.4M), sift PR 277 (Critical, ~7.5M), decompress PR 112, and expr-eval PR 288. OmniRoute stays the top Critical from-scratch card because Global GHSA-hf57 still lists no first patched version on npm through 3.8.50."
pick:
  label: "Worth doing today"
  package: node-forge
  action_label: "Review the open PR"
  action_url: "https://github.com/digitalbazaar/forge/pull/1152"
  approach: "Read PR 1152 and the CVE-2026-85393 notes, verify the nested DigestAlgorithm forgery guard stops RSA PKCS#1 v1.5 signature forgery without breaking valid signatures, then leave a review so a release past 1.4.0 can ship."
