headline: "deepmerge drops back to needs-pr after the maintainer closed fix PR 274 without a merge."
paragraphs:
  - "Re-checked GitHub Advisory, Snyk, and Aikido for 2026-09-25. Fresh High and Critical npm advisories from the last day (@bytebase/dbhub, suneditor, cline, @rsdoctor/rspack-plugin, Next.js ImageResponse CVE-2026-94545, and related packages) already ship patched releases, so they stay off this contribution board. Material board change: deepmerge CVE-2026-93753 moved from pr-open to needs-pr because TehShrike closed PR 274 without merging while issue 273 and npm 4.3.1 remain unfixed. OmniRoute, TidGi, gpt-crawler, and uri-js stay needs-pr. Prior open review work still holds on source-map-js, gray-matter, sift, decompress, node-forge, expr-eval, and @alifd/next. Recently resolved stays empty."
  - "Best from-scratch task is deepmerge at about 70.4 million weekly installs — open issue 273 and replace the closed PR 274 approach with a guard that drops __proto__/constructor/prototype keys regardless of target shape. Highest-impact review remains source-map-js PR 78 at about 137 million weekly. uri-js issue 105 is still waiting on a High DoS patch at about 118 million weekly. node-forge PR 1152 is about 31.0 million, gray-matter PR 182 is Critical at about 7.1 million, and sift PR 277 is Critical at about 4.8 million. OmniRoute stays the top Critical from-scratch card because Global GHSA-hf57 lists no first patched version on npm through 3.8.50."
pick:
  label: "Worth doing today"
  package: deepmerge
  action_label: "Open a fresh fix PR"
  action_url: "https://github.com/TehShrike/deepmerge/issues/273"
  approach: "Read issue 273 and the closed PR 274 discussion, then open a new PR that rejects __proto__, constructor, and prototype keys in mergeObject for every target shape (including null-prototype objects), add regression tests for those cases, and ask for maintainer review so a release past 4.3.1 can ship."
