headline: "Wednesday shift: deepmerge moved to In progress (PR 274) and Critical gray-matter (CVE-2026-78847) joined with open PR 182."
paragraphs:
  - "Re-checked GitHub Advisory, Snyk, and Aikido for 2026-09-23. Fresh High and Critical npm advisories largely already ship patched releases (unleash-server, @deepstream/server, request-filtering-agent, js-yaml, orval, and others), so they stay off this contribution board. Material board change: deepmerge issue 273 now has open fix PR 274, so the card moves to In progress. Added gray-matter for CVE-2026-78847 (Critical eval RCE via the js/javascript front-matter engine) with open PR 182. OmniRoute, TidGi, and gpt-crawler remain needs-pr. Open review work also remains on sift, decompress, node-forge, expr-eval, and @alifd/next. Recently resolved stays empty."
  - "Highest-impact review is deepmerge PR 274 at about 70.4 million weekly installs. node-forge PR 1152 is still about 31.0 million, gray-matter PR 182 is Critical at about 7.1 million, sift PR 277 is Critical at about 4.8 million, and decompress PR 112 reaches about 2.6 million. OmniRoute remains the best Critical from-scratch task because Global GHSA-hf57 still lists no first patched version on npm through 3.8.50."
pick:
  label: "Worth doing today"
  package: deepmerge
  action_label: "Review the open PR"
  action_url: "https://github.com/TehShrike/deepmerge/pull/274"
  approach: "Open PR 274, confirm it rejects __proto__ by key name in both merge loops, skim the four new prototype-poisoning regression tests, then leave a review so maintainers can cut a patch past 4.3.1."
