headline: "Tuesday add: deepmerge (CVE-2026-93753) joins Ready to work at ~70.8M weekly installs with no fix PR yet."
paragraphs:
  - "Re-checked GitHub Advisory, Snyk, and Aikido for 2026-09-22. Most fresh Critical and High npm advisories already ship patched releases, so they stay off this contribution board. Added deepmerge: High prototype-poisoning via mergeObject, still unfixed on 4.3.1, tracking issue 273 open, no fix PR. OmniRoute, TidGi, and gpt-crawler remain needs-pr. Open review work remains on sift, decompress, node-forge, expr-eval, and @alifd/next. Recently resolved stays empty."
  - "Highest-impact new write is deepmerge issue 273 at about 70.8 million weekly installs. For review, node-forge PR 1152 is still about 30.7 million, sift PR 277 is Critical at about 4.8 million, and decompress PR 112 reaches about 2.6 million. OmniRoute remains the best Critical from-scratch task because GitHub Advisory still lists no first patched version."
pick:
