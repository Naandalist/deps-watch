  action_url: "https://github.com/TehShrike/deepmerge/issues/273"
  approach: "Read issue 273 and CVE-2026-93753, confirm npm 4.3.1 still lacks a key-name denylist in mergeObject, then open a PR that rejects __proto__/constructor/prototype by key name before any assignment and add a regression test for null-prototype targets."
