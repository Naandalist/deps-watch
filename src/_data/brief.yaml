headline: "No new unpatched High or Critical npm advisories today; braces PR 79 is the High fix most worth a review by weekly installs."
paragraphs:
  - "Morning refresh for 2026-10-13 (Asia/Jakarta). Re-opened every action_url: all eight fix PRs remain open and unmerged, both Ready tracking issues remain open, and no package on the board has published a patched npm release. TidGi issue 713 and gray-matter PR 182 were re-checked and stay open. Recent GHSA, Snyk, and Aikido entries (tinacms, fast-jwt, handlebars, payload, ghost, mariadb, and others) already ship patched versions, so no cards were added."
  - "Review load by weekly installs: braces PR 79 (~170M), uri-js PR 107 (~157M), deepmerge PR 277 (~102M), and node-forge PR 1152 (~40M) lead the High queue. Critical PRs at gray-matter 182, decompress 112, and zerox 208 still wait on maintainers. For writing a fix from scratch, TidGi issue 713 (Critical) and gpt-crawler issue 418 remain the Ready cards."
pick:
  label: "Worth doing today"
  package: braces
  action_label: "Review the open PR"
  action_url: "https://github.com/micromatch/braces/pull/79"
  approach: "Read PR 79 (and optional alt PR 87) alongside CVE-2026-93687, run the test suite, and leave a clear, test-backed review so the maintainers can move toward a release past 3.0.3."
