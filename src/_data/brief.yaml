headline: "Twelve High and Critical cards still open; deepmerge tracking closed as wontfix while npm stays unpatched."
paragraphs:
  - "Morning refresh for 2026-10-03 (Asia/Jakarta). Re-opened every action_url and re-scanned GitHub Advisory, Snyk, and Aikido. No new High/Critical npm cards worth adding — fresh advisory traffic is mostly already patched (vm2 3.11.7, devalue 5.9.3, basic-ftp 6.2.1, fastify 5.12.2, axios 1.20.0, trigger.dev 4.5.2, brace-expansion). deepmerge issue 273 was closed by the maintainer as wontfix on 2026-10-02; PR 274 remains closed unmerged and npm is still 4.3.1, so the card stays needs-pr. All nine fix PRs from yesterday remain open. Recently resolved stays empty."
  - "Highest-impact review today is braces PR 72 at about 202 million weekly installs. Close behind: uri-js PR 107 (~187M), http-cache-semantics PR 58 (~59.8M), and node-forge PR 1152 (~46.7M). Other open review load: gray-matter PR 182 (Critical, ~12.3M), sift PR 277 (Critical, ~7.8M), decompress PR 112, expr-eval PR 288, and zerox PR 208 (Critical, 12.3k stars). Best from-scratch write remains deepmerge at about 116 million weekly despite the closed tracking issue — or TidGi issue 713 and gpt-crawler issue 418 for Critical/High needs-pr work with open maintainers."
pick:
  label: "Worth doing today"
  package: braces
  action_label: "Review the open PR"
  action_url: "https://github.com/micromatch/braces/pull/72"
  approach: "Read PR 72 and issue 70 for CVE-2026-93687, confirm the AST walkers gain a safe depth guard without breaking valid expansions, then leave a review so a release past 3.0.3 can ship."
