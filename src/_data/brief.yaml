headline: "Eleven High and Critical contribution cards after dropping two patched packages and adding zerox on 2026-10-01."
paragraphs:
  - "Morning refresh for 2026-10-01 (Asia/Jakarta). Re-opened every action_url and re-scanned GitHub Advisory, Snyk, and Aikido. Dropped source-map-js (CVE-2026-93749): PR 79 merged and npm 1.2.2 shipped. Dropped OmniRoute (CVE-2026-88062 / GHSA-hf57): npm 3.8.51 is outside the advisory vulnerable range (<= 3.8.50). Added zerox (CVE-2026-85672, Critical) with open fix PR 208. Other recent Critical/High advisories already ship patched releases (Next.js next/og ImageResponse, @xhmikosr/decompress symlink chain, Angular SSR router matrix-param DoS on supported 20–22 lines, @grpc/grpc-js, axios 1.20.0, orval, DBHub, openclaw, n8n lines) or are malware/typosquat incidents without a contribution PR path. Recently resolved stays empty."
  - "Highest-impact review today is node-forge PR 1152 at about 45.1 million weekly installs. Other open review load: http-cache-semantics PR 58 (~58.3M), gray-matter PR 182 (Critical, ~11.7M), sift PR 277 (Critical, ~7.7M), decompress PR 112, expr-eval PR 288, and zerox PR 208 (Critical, 12.3k stars). Best from-scratch write remains deepmerge at about 112 million weekly — open issue 273 after PR 274 closed unmerged. uri-js issue 105 is still a High DoS gap at about 182 million weekly. TidGi issue 713 and gpt-crawler issue 418 remain open Critical/High needs-pr cards."
pick:
  label: "Worth doing today"
  package: node-forge
  action_label: "Review the open PR"
  action_url: "https://github.com/digitalbazaar/forge/pull/1152"
  approach: "Read PR 1152 and the CVE-2026-85393 notes, confirm the RSA PKCS#1 v1.5 forgery path is closed for nested DigestAlgorithm garbage, then leave a review so a release past 1.4.0 can ship."
