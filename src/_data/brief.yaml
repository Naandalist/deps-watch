headline: "sift shipped its prototype-pollution fix in 17.1.4 and leaves the board, while uri-js PR 107 and braces PR 79 remain the biggest open reviews by weekly installs."
paragraphs:
  - "Morning refresh for 2026-10-10 (Asia/Jakarta). Re-opened every action_url. On 2026-10-08 the sift maintainer released 17.1.4 including the PR 277 fix via PR 279, so the sift card was dropped as resolved. braces gained another alternative fix, PR 87, while PR 79 stays open and the advisory dispute continues. uri-js PR 107 is still open with users asking for a merge. All other cards are unchanged and still open; no new cards were added this run."
  - "Review load by weekly installs: braces PR 79 (~207M), uri-js PR 107 (~195M), deepmerge PR 277 (~121M), and node-forge PR 1152 (~48M) lead the High queue, while Critical PRs at gray-matter 182, decompress 112, and zerox 208 still wait on maintainers. For writing a fix from scratch, TidGi issue 713 (Critical) and gpt-crawler issue 418 remain the Ready cards."
pick:
  label: "Worth doing today"
  package: uri-js
  action_label: "Review the open PR"
  action_url: "https://github.com/garycourt/uri-js/pull/107"
  approach: "Read PR 107 alongside CVE-2026-93690, run the existing test suite, and confirm normal URI normalization output is unchanged; a clear, test-backed review helps the maintainer move toward a release past 4.4.1."
