headline: "Eleven High and Critical contribution cards remain open after a fresh Snyk, GHSA, and Aikido pass."
paragraphs:
  - "Re-checked GitHub Advisory, Snyk, and Aikido for 2026-09-28. Nothing published on 2026-09-27 or 2026-09-28 that belongs on this contribution board; recent Critical and High npm advisories (DBHub DNS rebinding, SunEditor XSS, Knowns path traversal, OpenZeppelin confidential-contracts, Cline Hub WS hijack, @rsdoctor/rspack-plugin, devalue Buffer leak, ioredis recursion, and related packages) already ship patched releases. The withdrawn Knowns duplicate Critical was skipped. All five needs-pr cards remain true: OmniRoute GHSA-hf57 still lists no first patched version through npm 3.8.50, TidGi issue 713 is open, gpt-crawler issue 418 is open, uri-js issue 105 is open, and deepmerge issue 273 is still waiting after PR 274 closed unmerged. All six remaining pr-open reviews are still open and unmerged. Dropped Medium @alifd/next (PR 5115 still open upstream, but it aged past the In progress window and the board prefers High|Critical). Recently resolved stays empty."
  - "Highest-impact review today is source-map-js PR 78 at about 213 million weekly installs. Best from-scratch write remains deepmerge at about 109 million weekly — open issue 273 and replace the closed PR 274 approach. uri-js issue 105 is still a High DoS gap at about 180 million weekly. Other open review load: node-forge PR 1152 (~45.9M), gray-matter PR 182 (Critical, ~11.3M), sift PR 277 (Critical, ~7.5M), decompress PR 112, and expr-eval PR 288. OmniRoute stays the top Critical from-scratch card because Global GHSA-hf57 still lists no first patched version on npm through 3.8.50."
pick:
  label: "Worth doing today"
  package: source-map-js
  action_label: "Review the open PR"
  action_url: "https://github.com/7rulnik/source-map-js/pull/78"
  approach: "Read PR 78 and the CVE-2026-93749 notes, verify the section-offset validation stops the indexed source-map event-loop DoS without breaking valid maps, then leave a review so a release past 1.2.1 can ship."
