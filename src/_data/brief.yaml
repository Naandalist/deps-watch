headline: "OmniRoute joins Ready as a Critical with no patched release. sift and node-forge still need review, while next, astro, and maplibre-gl land in Resolved."
paragraphs:
  - "Overnight GHSA traffic was heavy. next, astro, and maplibre-gl Critical advisories now have patched npm releases, so they move into Recently resolved with js-yaml and sharp. OmniRoute (CVE-2026-88062) is still listed as vulnerable through 3.8.50 with no first_patched_version, so it is a new Ready card. The four smaller needs-pr cards are unchanged, and sift plus node-forge stay In progress with open PRs."
  - "If you can only do one thing, review sift PR 277. It is Critical, covers about 3.5 million weekly installs, and the patch is still waiting on maintainers. If you want maximum blast radius instead, node-forge PR 1152 remains open on roughly 20 million weekly downloads. For a from-scratch Critical, OmniRoute still needs a fix PR that actually ships a patched release."
pick:
  label: "Worth doing today"
  package: sift
  action_label: "Review the open PR"
  action_url: "https://github.com/crcn/sift.js/pull/277"
  approach: "Read PR 277 against issue 276. Confirm the own-property guards cover both enumeration loops, then leave a review or a failing test if anything still slips through."