headline: "Sunday refresh: open fix PRs still need review, while OmniRoute remains without a first patched release."
paragraphs:
  - "Re-verified the board for 2026-09-13. Ready still leads with Critical OmniRoute through 3.8.50 (GHSA-hf57 has no first_patched_version), plus the four smaller needs-pr cards. In progress is unchanged: sift, decompress, node-forge, and expr-eval all still have open fix PRs and npm has not moved. Recently resolved next/astro/maplibre-gl/js-yaml/sharp stay patched; smol-toml, nodemailer, and multer join as newly confirmed High fixes on npm."
  - "If you can only do one thing, review node-forge PR 1152. It covers about 27 million weekly installs and still waits on maintainers after the incomplete CVE-2026-33894 fix. For a Critical open PR, sift PR 277 (~4.8M weekly) and decompress PR 112 (~2.5M weekly) also need eyes. For a from-scratch Critical, OmniRoute still needs a fix that ships past 3.8.50."
pick:
  label: "Worth doing today"
  package: node-forge
  action_label: "Review the open PR"
  action_url: "https://github.com/digitalbazaar/forge/pull/1152"
  approach: "Read PR 1152 against issue 1149. Confirm the nested DigestAlgorithm SEQUENCE length check rejects garbage children, then leave a review or a failing test if anything still verifies forged EM."
