headline: "braces lost its second fix PR overnight, so the card now points at PR 79, while node-forge PR 1152 is still the clearest High fix waiting on a reviewer."
paragraphs:
  - "Morning refresh for 2026-10-07 (Asia/Jakarta). Re-opened every action_url and re-scanned GitHub Advisory, Snyk, and Aikido. braces PR 77, the opt-in maxDepth proposal, was closed by its author on 2026-10-06 as the maintainer kept disputing CVE-2026-93687 and a dispute is open against the GitHub advisory, so the card now points at PR 79, one of two nesting-limit PRs opened the same day. uri-js PR 107 picked up a community approval but still needs a maintainer. The other cards are unchanged. New advisory traffic (payload, shell-quote, simple-git, seroval, proxy-addr, tinypool, vm2 3.12.x, nx, compression, thrift, katex, basic-ftp) already ships patched releases, so no new cards were added."
  - "Review load by weekly installs: braces PR 79 (~207M), uri-js PR 107 (~195M), deepmerge PR 277 (~121M), and node-forge PR 1152 (~48M) lead the High queue, while Critical PRs at gray-matter 182, sift 277, decompress 112, and zerox 208 still wait on maintainers. With nine open PRs the In progress column shows its top eight, so expr-eval PR 288 stays off-screen but open. For writing a fix from scratch, TidGi issue 713 (Critical) and gpt-crawler issue 418 remain the only Ready cards."
pick:
  label: "Worth doing today"
  package: node-forge
  action_label: "Review the open PR"
  action_url: "https://github.com/digitalbazaar/forge/pull/1152"
  approach: "Read PR 1152 alongside CVE-2026-85393, run the existing RSA and PKCS#1 test suites, and confirm that valid signatures still verify while malformed DigestInfo structures are rejected; downstream users have already asked for a review, so a careful, test-backed review gives the maintainers a reason to merge and cut a release past 1.4.0."
